<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="646" viewBox="0 0 1040 646" fill="none" role="img">
  <rect width="1040" height="646" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="30" y="24" width="980" height="136" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="46" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">INSTALLED FOR YOUR USER</text>
  <path d="M49 67 h9 l5 5 v11 h-14 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="79" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.local/bin/vela-bin</text>
    <text x="500" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">the binary, copied by install.sh from the release build</text>
  <path d="M49 97 h9 l5 5 v11 h-14 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="109" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.local/share/applications/vela.desktop</text>
    <text x="500" y="109" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">the launcher, with the WebKit workaround already in its Exec line</text>
  <path d="M49 127 h9 l5 5 v11 h-14 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="139" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.local/share/dbus-1/services/</text>
    <text x="500" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">the D-Bus service, so a file manager request reaches Vela</text>
  <rect x="30" y="178" width="980" height="166" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="200" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">YOUR CONFIGURATION</text>
  <path d="M49 221 h9 l5 5 v11 h-14 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="233" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.config/vela/profiles.json</text>
    <text x="500" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">your layouts: which panel sits in which zone, per profile</text>
  <path d="M49 251 h9 l5 5 v11 h-14 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="263" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.config/vela/favorites.json</text>
    <text x="500" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">pinned places and their groups</text>
  <path d="M49 281 h9 l5 5 v11 h-14 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="293" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.config/vela/tags.json</text>
    <text x="500" y="293" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">tab colours and tags</text>
  <path d="M46 311 h7 l3 3 h10 v12 h-20 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="323" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.config/vela/templates/</text>
    <text x="500" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">the templates offered when you create a new file</text>
  <rect x="30" y="362" width="980" height="106" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="384" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">OPTIONAL TOOLS, EACH IN ITS OWN VENV</text>
  <path d="M46 405 h7 l3 3 h10 v12 h-20 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="417" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.local/share/vela/demucs-venv</text>
    <text x="500" y="417" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">stem separation, about 3 GB of torch, installed on demand</text>
  <path d="M46 435 h7 l3 3 h10 v12 h-20 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="447" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.local/share/vela/dl-venv</text>
    <text x="500" y="447" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">yt-dlp and spotdl for the downloader</text>
  <rect x="30" y="486" width="980" height="136" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="508" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">RUNTIME</text>
  <circle cx="56" cy="536" r="6" fill="none" stroke="#d8a35f" stroke-width="1.4"/><circle cx="56" cy="536" r="2" fill="#d8a35f"/>
    <text x="76" y="541" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">$XDG_RUNTIME_DIR/vela-control.sock</text>
    <text x="500" y="541" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">the MCP socket: one path, so one instance at a time talks to Claude</text>
  <path d="M48 559 h14 v16 h-14 z M51 564 h8 M51 568 h8 M51 572 h5" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="571" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">~/.local/share/vela/logs/</text>
    <text x="500" y="571" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">downloads and background jobs</text>
  <path d="M48 589 h14 v16 h-14 z M51 594 h8 M51 598 h8 M51 602 h5" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="601" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">logs/dev.log</text>
    <text x="500" y="601" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">development only, written by start.sh on port 1430</text>
</svg>