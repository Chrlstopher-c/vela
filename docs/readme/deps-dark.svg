<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="232" viewBox="0 0 1040 232" fill="none" role="img">
  <rect width="1040" height="232" rx="16" fill="#0a0b0e" stroke="#20242c"/>
  <text x="30" y="36" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#8b929c">WHAT IT STANDS ON</text>
  <rect x="30" y="56" width="313.3333333333333" height="152" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="48" y="106" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#f4f1ea">Tauri v2</text>
  <text x="48" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">Rust backend, React 19 and Tailwind 4 in a</text><text x="48" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">WebKitGTK window</text>
  <text x="48" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">CodeMirror 6, xterm.js, pdf.js, SheetJS</text>
  <rect x="363.3333333333333" y="56" width="313.3333333333333" height="152" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="381.3333333333333" y="106" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#f4f1ea">libgit2</text>
  <text x="381.3333333333333" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">Git without ever shelling out to the git</text><text x="381.3333333333333" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">binary</text>
  <text x="381.3333333333333" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">status badges, staging, branches, inline</text><text x="381.3333333333333" y="187" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">diff</text>
  <rect x="696.6666666666666" y="56" width="313.3333333333333" height="152" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="714.6666666666666" y="106" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#f4f1ea">GStreamer</text>
  <text x="714.6666666666666" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">GPU decoding for the native player, around</text><text x="714.6666666666666" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">WebKit's video element</text>
  <text x="714.6666666666666" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">ffmpeg and the image crate for the editing</text><text x="714.6666666666666" y="187" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">tools</text>
</svg>